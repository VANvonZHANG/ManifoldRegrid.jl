name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.11"
        os:
          - ubuntu-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # ManifoldMeshes 0.8.0 is registered, so it resolves from the registry by
      # name. ManifoldFields is not registered yet: it is added from GitHub at
      # the pinned revision that carries `location_axis` / `interpolate(f,
      # dest_mesh)`. `add` (not `develop`) is required for `rev`; `develop` does
      # not accept it.
      #
      # TODO: once ManifoldFields 0.1.1 finishes its new-package waiting period
      # and is registered, drop this step entirely — both siblings will then
      # resolve from the registry (see ROADMAP.md, "Release prerequisites").
      # Both siblings must be supplied in a single `Pkg.add` call: adding one
      # alone triggers a resolve in which the other, already listed in [deps],
      # has no source yet and is not registered.
      - name: Add sibling packages (ManifoldFields not registered yet)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add([
              PackageSpec(name = "ManifoldMeshes"),
              PackageSpec(url = "https://github.com/VANvonZHANG/ManifoldFields.jl",
                          rev = "ea614c8"),
            ])
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
