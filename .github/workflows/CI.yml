name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.11"
        os:
          - ubuntu-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # The siblings are not registered yet, so they come from GitHub. The
      # revisions are pinned to the commits on `main` that carry the API this
      # package needs — the spherical polygon geometry layer (ManifoldMeshes
      # 0.8.0) and `location_axis` / `interpolate(f, dest_mesh)`
      # (ManifoldFields 0.1.1). Pinning keeps CI deterministic and records the
      # exact sibling generation this package was tested against.
      # `add` (not `develop`) is required: `develop` does not accept `rev`.
      #
      # TODO: drop the pins and depend on the released versions once 0.8.0 and
      # 0.1.1 are tagged (see ROADMAP.md, "Release prerequisites").
      - name: Add sibling packages (not registered yet)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add([
              PackageSpec(url = "https://github.com/VANvonZHANG/ManifoldMeshes.jl",
                          rev = "428fcfa"),
              PackageSpec(url = "https://github.com/VANvonZHANG/ManifoldFields.jl",
                          rev = "4f49604"),
            ])
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
