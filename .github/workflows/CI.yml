name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.11"
        os:
          - ubuntu-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Develop sibling packages (not registered yet)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url = "https://github.com/VANvonZHANG/ManifoldMeshes.jl"),
              PackageSpec(url = "https://github.com/VANvonZHANG/ManifoldFields.jl"),
            ])
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
